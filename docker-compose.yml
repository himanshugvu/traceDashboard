version: "3.9"

services:
  mariadb:
    image: mariadb:11.8
    container_name: trace-dashboard-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: trace_db
      MARIADB_USER: trace_user
      MARIADB_PASSWORD: trace_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  mariadb_data:
